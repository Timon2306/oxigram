name: Release

# Manual only: builds installers of the native app for Windows, Linux and
# macOS and attaches them to a DRAFT pre-release, which is published by hand
# after a check. Uses only the built-in GITHUB_TOKEN; no other secrets.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            features: ""
            formats: nsis
            glob: "*.exe"
          - os: ubuntu-22.04
            name: linux-x86_64
            features: "--features gstreamer"
            formats: deb,appimage
            glob: "*.{deb,AppImage}"
          - os: macos-latest
            name: macos-aarch64
            features: ""
            formats: dmg
            glob: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file wget \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libdbus-1-dev libasound2-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked -p oxigram-native ${{ matrix.features }}

      # Packages the binary built above (target/release) into target/packager.
      - name: Package
        working-directory: native
        shell: bash
        run: cargo packager --release --formats ${{ matrix.formats }} ${{ matrix.features }}

      - name: Collect installers
        shell: bash
        run: |
          shopt -s extglob nullglob
          mkdir -p out
          cd target/packager
          for f in ${{ matrix.glob }}; do cp "$f" "../../out/oxigram-${{ matrix.name }}-$f"; done
          ls -l ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: oxigram-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: Oxigram native build ${{ github.run_number }}
          draft: true
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
