name: Release

# Manual only: builds installers of the native app for Windows, Linux and
# macOS and attaches them to a DRAFT pre-release, which is published by hand
# after a check. Uses only the built-in GITHUB_TOKEN; no other secrets.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Unsigned builds (no certificates): Windows SmartScreen and macOS
        # Gatekeeper warn on first start; the release notes say how to open.
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            features: ""
            formats: nsis
            glob: "*.exe"
          - os: windows-latest
            name: windows-x86
            target: i686-pc-windows-msvc
            features: ""
            formats: nsis
            glob: "*.exe"
          # Ubuntu 22.04 base: runs on glibc 2.35+ (Ubuntu 22.04, Debian 12,
          # Fedora 36 and newer).
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            features: "--features gstreamer"
            formats: deb,appimage
            glob: "*.{deb,AppImage}"
          - os: macos-latest
            name: macos-apple-silicon
            target: aarch64-apple-darwin
            features: ""
            formats: dmg
            glob: "*.dmg"
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin
            features: ""
            formats: dmg
            glob: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file wget \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libdbus-1-dev libasound2-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked -p oxigram-native --target ${{ matrix.target }} ${{ matrix.features }}

      # Packages the binary built above (target/release) into target/packager.
      - name: Package
        working-directory: native
        shell: bash
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} ${{ matrix.features }}

      - name: Collect installers
        shell: bash
        run: |
          shopt -s extglob nullglob
          mkdir -p out
          cd target/packager
          for f in ${{ matrix.glob }}; do cp "$f" "../../out/oxigram-${{ matrix.name }}-$f"; done
          ls -l ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: oxigram-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: Oxigram native build ${{ github.run_number }}
          draft: true
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          body: |
            Сборки без цифровой подписи.
            - Windows: если SmartScreen предупреждает — «Подробнее» → «Выполнить в любом случае». windows-x64 — для 64-битной Windows 10/11, windows-x86 — для 32-битной.
            - macOS: правый клик по Oxigram → «Открыть» (или Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть»). apple-silicon — M1/M2/M3, intel — Mac на Intel.
            - Linux: .deb для Ubuntu/Debian, .AppImage для остальных (chmod +x). Нужен glibc 2.35+ (Ubuntu 22.04 и новее).
