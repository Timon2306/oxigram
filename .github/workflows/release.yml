name: Release

# Manual only: builds installers for Windows and Linux and attaches them to a
# draft GitHub release, which is published by hand after a check.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: npm ci

      # No secrets: Oxigram ships without API keys, users bring their own.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Oxigram v__VERSION__
          releaseBody: |
            Windows: `Oxigram_*_x64-setup.exe` (installer) or the `.msi`.
            Linux: `.AppImage`, `.deb` or `.rpm`.

            On first start Oxigram asks for your own `api_id` / `api_hash` from https://my.telegram.org.
          releaseDraft: true
          prerelease: true
          uploadPlainBinary: true
