name: Release

# Manual only: builds installers of the native app for Windows, Linux and
# macOS and attaches them to a DRAFT pre-release, which is published by hand
# after a check. Uses only the built-in GITHUB_TOKEN; no other secrets.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Unsigned builds (no certificates): Windows SmartScreen and macOS
        # Gatekeeper warn on first start; the release notes say how to open.
        include:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            features: ""
            formats: nsis
            glob: "*.exe"
          - os: windows-latest
            name: windows-x86
            target: i686-pc-windows-msvc
            features: ""
            formats: nsis
            glob: "*.exe"
          # Cross-compiled on the x64 runner (its Visual Studio has the ARM64 tools).
          - os: windows-latest
            name: windows-arm64
            target: aarch64-pc-windows-msvc
            features: ""
            formats: nsis
            glob: "*.exe"
          - os: macos-latest
            name: macos-apple-silicon
            target: aarch64-apple-darwin
            features: ""
            formats: dmg
            glob: "*.dmg"
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin
            features: ""
            formats: dmg
            glob: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked -p oxigram-native --target ${{ matrix.target }} ${{ matrix.features }}

      # Packages the binary built above (target/release) into target/packager.
      - name: Package
        working-directory: native
        shell: bash
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Collect installers
        shell: bash
        run: |
          shopt -s extglob nullglob
          mkdir -p out
          cd target/packager
          for f in ${{ matrix.glob }}; do cp "$f" "../../out/oxigram-${{ matrix.name }}-$f"; done
          ls -l ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: oxigram-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Linux is built inside Debian 11, so the binary needs only glibc 2.31:
  # it starts on Ubuntu 20.04+, Debian 11+, ALT p10+, Fedora 33+ and the like
  # (built on the Ubuntu 22.04 runner it needed glibc 2.35).
  build-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: debian:bullseye
    env:
      # No FUSE inside the container: AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install build dependencies
        run: |
          # Bullseye is end of life: its packages moved to archive.debian.org.
          rm -f /etc/apt/sources.list.d/*
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian bullseye-updates main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential pkg-config file wget xz-utils \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libdbus-1-dev libasound2-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: x86_64-unknown-linux-gnu-bullseye

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked -p oxigram-native --target x86_64-unknown-linux-gnu --features gstreamer

      # Packages the binary built above; cargo packager takes no --features.
      - name: Package
        working-directory: native
        shell: bash
        run: cargo packager --release --target x86_64-unknown-linux-gnu --formats deb,appimage

      - name: Collect installers
        shell: bash
        run: |
          shopt -s extglob nullglob
          mkdir -p out
          cd target/packager
          for f in *.{deb,AppImage}; do cp "$f" "../../out/oxigram-linux-x64-$f"; done
          ls -l ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: oxigram-linux-x64
          path: out/*
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native/Cargo.toml
          sparse-checkout-cone-mode: false

      # The tag comes from the version in native/Cargo.toml, e.g. v0.2.0.
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(grep -m1 '^version' native/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # The in-app updater checks the downloaded installer against this file.
      - name: Checksums
        shell: bash
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Oxigram v${{ steps.version.outputs.value }}
          draft: true
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          body: |
            Какой файл скачать:
            - `oxigram-windows-x64-…-setup.exe` — Windows 10/11, 64 бита (обычный ПК)
            - `oxigram-windows-x86-…-setup.exe` — Windows 10/11, 32 бита
            - `oxigram-windows-arm64-…-setup.exe` — Windows 11 на ARM (Snapdragon, Surface Pro X)
            - `oxigram-linux-x64-….deb` — Ubuntu, Debian, Mint (Ubuntu 20.04 / Debian 11 и новее)
            - `oxigram-linux-x64-….AppImage` — другие дистрибутивы (`chmod +x`, затем запустить); нужен glibc 2.31+ (ALT p10, Fedora 33 и новее)
            - `oxigram-macos-apple-silicon-….dmg` — Mac на M1/M2/M3/M4
            - `oxigram-macos-intel-….dmg` — Mac на Intel

            Сборки без цифровой подписи:
            - Windows: если SmartScreen предупреждает — «Подробнее» → «Выполнить в любом случае».
            - macOS: при первом запуске правый клик по Oxigram → «Открыть» (или Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть»).

            <a href="https://slint.dev"><img src="https://raw.githubusercontent.com/slint-ui/slint/master/logo/MadeWithSlint-logo-whitebg.png" height="40" alt="Made with Slint"></a>
