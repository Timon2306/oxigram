name: CI

# Manual only: runs when started from the Actions tab, never on push, so it
# spends no Actions minutes unless asked to.
on:
  workflow_dispatch:

# Read-only token, and no secrets anywhere: Oxigram ships without API keys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # No `cargo fmt --check` job: the repo is not rustfmt-clean yet.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: ""
          - os: ubuntu-22.04
            features: "--features gstreamer"
          - os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The runner image ships libunwind-14-dev, which blocks GStreamer's
          # libunwind-dev dependency ("held broken packages").
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libdbus-1-dev libasound2-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Tests
        run: cargo test -p oxigram-core -p oxigram-native ${{ matrix.features }}

      - name: Build
        run: cargo build --release -p oxigram-native ${{ matrix.features }}
