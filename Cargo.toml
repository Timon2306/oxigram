[workspace]
resolver = "3"
members = ["core", "src-tauri", "native"]
default-members = ["core", "src-tauri"]

# Size first: the whole point of the project is a small footprint.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
