[workspace]
resolver = "3"
members = ["core", "native"]

# Size first: the whole point of the project is a small footprint.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Colour emoji in the software renderer: Slint 1.18 rasterises glyph outlines as
# alpha only, so emoji came out monochrome. native/vendor holds a copy of
# i-slint-renderer-software 1.18.1 plus a small patch (search "OXIGRAM") that
# draws COLR/CBDT/sbix glyphs as RGBA. Drop this when upstream does it.
[patch.crates-io]
i-slint-renderer-software = { path = "native/vendor/i-slint-renderer-software-1.18.1" }
# StyledText takes only clicks and hovers on its links (see the patch in
# items/text.rs), so right clicks on message text still open the menu.
i-slint-core = { path = "native/vendor/i-slint-core-1.18.1" }
