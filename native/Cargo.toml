[package]
name = "oxigram-native"
version = "0.1.0"
description = "Oxigram with a native window: no WebView"
authors = ["Timon2306"]
license = "MIT"
edition = "2024"

[[bin]]
name = "oxigram-native"
path = "src/main.rs"

[dependencies]
oxigram-core = { path = "../core" }
# Software renderer is the default (see [features]): no OpenGL context, whose
# driver memory would cost more than the whole UI. No accessibility tree for now (AccessKit keeps
# a second copy of every widget).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Avatars are decoded and shrunk to their on-screen size before they reach
# the UI, so a 640 px photo costs ~10 KB of memory, not 1.6 MB.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# "Копировать картинку": puts pixels on the system clipboard.
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Linux in-app video (feature "gstreamer"); the GStreamer dev libraries
# (libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev) are needed only
# when the feature is enabled.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[features]
default = ["gpu"]
# OpenGL rendering through femtovg. Built in by default so one binary has both
# renderers; which one runs is chosen at start-up from the "GPU rendering"
# setting (software is the default: ~8 MB, while the OpenGL driver alone adds
# ~75-80 MB). It draws colour emoji. SLINT_BACKEND in the environment wins.
gpu = ["slint/renderer-femtovg"]
# In-app video on Linux; without it videos open in the system player.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[build-dependencies]
slint-build = "1.18"
