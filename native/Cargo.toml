[package]
name = "oxigram-native"
version = "0.1.0"
description = "Oxigram with a native window: no WebView"
authors = ["Timon2306"]
license = "MIT"
edition = "2024"

[[bin]]
name = "oxigram-native"
path = "src/main.rs"

[dependencies]
oxigram-core = { path = "../core" }
# Software renderer is the default (see [features]): no OpenGL context, whose
# driver memory would cost more than the whole UI. No accessibility tree for now (AccessKit keeps
# a second copy of every widget).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "unstable-winit-030",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Avatars are decoded and shrunk to their on-screen size before they reach
# the UI, so a 640 px photo costs ~10 KB of memory, not 1.6 MB.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
# "Прикрепить файл": the system file dialog (native on Windows and macOS; on
# Linux the xdg-desktop-portal over D-Bus, so no GTK is needed for it).
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
# "Копировать картинку": puts pixels on the system clipboard.
arboard = { version = "3", default-features = false, features = ["image-data"] }

# In-app voice and audio: symphonia demuxes and decodes MP3/AAC/M4A/Vorbis/
# FLAC/WAV in pure Rust; Ogg Opus (Telegram voice) goes through the pure-Rust
# opus-decoder; cpal does the output (WASAPI / CoreAudio / ALSA).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "alac"] }
opus-decoder = "0.1"
cpal = "0.16"

# System tray and notifications (the versions the Tauri build uses).
tray-icon = "0.25"
notify-rust = "4.19"

# In-app video on Windows 8+ (Media Foundation's media engine, WIC frames).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    # Files copied in Explorer (CF_HDROP).
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
] }
# `#[implement]` for the engine's notification callback.
windows-core = "0.62"

# Video playback on macOS goes through AVFoundation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# The CMTime / CVPixelBuffer methods are behind these features.
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"

# Linux in-app video (feature "gstreamer"); the GStreamer dev libraries
# (libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev) are needed only
# when the feature is enabled.
[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon on Linux needs a GTK main loop, run on a thread of its own.
gtk = "0.18"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[features]
default = ["gpu"]
# OpenGL rendering through femtovg. Built in by default so one binary has both
# renderers; which one runs is chosen at start-up from the "GPU rendering"
# setting (software is the default: ~8 MB, while the OpenGL driver alone adds
# ~75-80 MB). It draws colour emoji. SLINT_BACKEND in the environment wins.
gpu = ["slint/renderer-femtovg"]
# In-app video on Linux; without it videos open in the system player.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[build-dependencies]
slint-build = "1.18"
